<!DOCTYPE html>
<html lang="de">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcher Speicher100-Typ bist du?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Black ink on white paper, like the house line drawing; one step per screen. */
:root{
  --paper:#ffffff; --ink:#111111; --mute:#5f5f5f; --line:#d9d9d9; --soft:#f3f3f3;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);margin:0}
body{font-family:var(--sans);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-bottom:28px}
/* Step content sits between header and footer; centered vertically when the screen is taller than the content. */
.step{margin-block:auto;padding-block:20px;width:100%;max-width:560px;align-self:center}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:14px;gap:12px}
.mark{font-weight:700;letter-spacing:.14em;font-size:13px;display:flex;align-items:center}
.mark img{height:30px;width:auto;display:block}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:4px 10px;font-family:var(--mono);font-size:12px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(32px,9.5vw,46px)}
h2{font-size:26px}
h3{font-size:28px;letter-spacing:-.03em}
p{margin:0}
.house{display:block;width:100%;height:auto;max-width:100%}
.btn{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px}
.btn:active{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper);text-align:center;font-weight:600}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--mute);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.vibes{display:flex;flex-direction:column;gap:22px}
.vibes article{display:flex;flex-direction:column;gap:6px;border-top:1.5px solid var(--ink);padding-top:12px}
ul.roles{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
ul.roles li{border-bottom:1px solid var(--line);padding:7px 0 7px 18px;position:relative}
ul.roles li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1.5px solid var(--ink);border-radius:10px;padding:12px;background:var(--paper);width:100%}
.field input[aria-invalid=true]{border-width:3px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:#111;flex:none}
.small{font-size:13px;color:var(--mute)}
.err{font-size:14px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.vibe{font-size:clamp(56px,18vw,84px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.foot{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
/* Fluid scale: type, gaps and gutters grow with screen width AND height, so big screens get big, airy content instead of a small block. */
:root{--fs:clamp(16px,calc(12px + .35vw + .45vh),23px);--gap:clamp(14px,calc(.8vw + 1.4vh),34px);--gx:clamp(16px,5vw,72px)}
body{font-size:var(--fs);padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
.wrap{max-width:min(560px,100%);padding-bottom:0}
.top{padding-block:clamp(14px,3.2vh,44px)}
.mark img{height:clamp(30px,calc(20px + 1.5vw),48px)}
.lang button{padding:clamp(4px,.55vw,8px) clamp(10px,1.1vw,16px);font-size:clamp(12px,calc(10px + .35vw),15px)}
.step{padding-block:clamp(20px,4vh,72px)}
.stack{gap:var(--gap)}
.stack .stack{gap:calc(var(--gap) * .8)}
h1{font-size:clamp(34px,calc(4.2vw + 2.2vh),112px);line-height:.98;letter-spacing:-.03em}
h2{font-size:clamp(26px,calc(1.5vw + 1.6vh),50px)}
h3{font-size:clamp(28px,calc(1.4vw + 1.2vh),44px)}
.intro p{max-width:46ch}
.nw{white-space:nowrap}
.btn{padding:clamp(14px,1.7vh,22px) clamp(16px,1.6vw,26px);border-radius:clamp(14px,1.2vw,20px)}
.btn.primary{margin-top:calc(var(--gap) * .3)}
.link{font-size:calc(var(--fs) * .94)}
.small{font-size:calc(var(--fs) * .82)}
.check{font-size:calc(var(--fs) * .88)}
.check input{width:calc(var(--fs) * 1.2);height:calc(var(--fs) * 1.2)}
.label{font-size:clamp(11px,calc(9px + .3vw),14px)}
.field input{padding:clamp(12px,1.4vh,18px)}
ul.roles li{padding-block:clamp(7px,1vh,12px)}
ul.roles li::before{top:calc(clamp(7px,1vh,12px) + .72em - 5px)}
.vibes article{gap:calc(var(--gap) * .4)}
.vibe{font-size:clamp(56px,calc(6vw + 4vh),160px)}
.foot{margin-top:0;padding-block:clamp(16px,3vh,40px);gap:clamp(16px,2vw,36px)}
@media (min-width:600px){.wrap{max-width:680px}}
@media (min-width:900px){
 .wrap{max-width:min(1360px,100%)}
 .step{max-width:720px}
 .step.intro{max-width:min(1040px,100%)}
 .step.intro .house{max-height:36vh;object-fit:contain}
 .step.intro p{font-size:calc(var(--fs) * 1.1)}
 .step.wide{max-width:none}
 .vibes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(32px,3.5vw,72px)}
}
/* Landscape desktop: house left, text right. Tall desktop windows keep the stacked layout, just bigger. */
@media (min-width:900px) and (min-aspect-ratio:5/4){
 .step.intro{max-width:none;display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(48px,6vw,128px);align-items:center}
 .step.intro .house{max-height:70vh}
}
@media (min-width:900px){
 .step.wide>.btn.primary,.step.wide>.link{max-width:520px;width:100%}
}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

function score(ans){if(!ans.length)return null;var c={a:0,f:0,m:0};ans.forEach(function(x){c[x]++});var max=Math.max(c.a,c.f,c.m);
 for(var k=ans.length-1;k>=0;k--){if(c[ans[k]]===max)return ans[k]}}
var S={lang:(navigator.language||"de").slice(0,2)==="de"?"de":"en",step:"intro",i:0,ans:[],sending:false,error:null,form:{vorname:"",email:"",telefon:"",newsletter:false,einwilligung:false}};
function L(){return T[S.lang]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function head(){return '<div class="top"><span class="mark">'+(LOGO.indexOf("data:")===0?'<img src="'+LOGO+'" alt="Speicher100">':'SPEICHER100')+'</span><div class="lang" role="group" aria-label="Sprache / Language">'
 +'<button data-lang="de" aria-pressed="'+(S.lang==="de")+'">DE</button><button data-lang="en" aria-pressed="'+(S.lang==="en")+'">EN</button></div></div>'}

function form(){var l=L(),f=S.form,e=S.error;
 return '<form class="stack" id="f" novalidate>'
 +'<div class="field"><label class="label" for="fn">'+l.name+'</label><input id="fn" name="vorname" autocomplete="given-name" value="'+esc(f.vorname)+'"'+(e==="vorname"?' aria-invalid="true"':'')+'></div>'
 +'<div class="field"><label class="label" for="fe">'+l.email+'</label><input id="fe" name="email" type="email" inputmode="email" autocomplete="email" value="'+esc(f.email)+'"'+(e==="email"?' aria-invalid="true"':'')+'></div>'
 +'<div class="field"><label class="label" for="fp">'+l.phone+'</label><input id="fp" name="telefon" type="tel" inputmode="tel" autocomplete="tel" value="'+esc(f.telefon)+'"'+(e==="telefon"?' aria-invalid="true"':'')+'></div>'
 +'<label class="check"><input type="checkbox" id="fnews"'+(f.newsletter?" checked":"")+'><span>'+l.news+'</span></label>'
 +'<label class="check"><input type="checkbox" id="fok"'+(f.einwilligung?" checked":"")+(e==="einwilligung"?' aria-invalid="true"':'')+'><span>'+l.consent+' <a href="https://speicher100.org/datenschutz/" target="_blank" rel="noopener">'+l.privacy+'</a></span></label>'
 +(e?'<p class="err" role="alert">'+l.errs[e]+'</p>':'')
 +'<button class="btn primary" type="submit"'+(S.sending?" disabled":"")+'>'+(S.sending?l.sending:l.send)+'</button></form>'}
function view(){var l=L(),h=head();
 if(S.step==="intro")h+='<div class="stack fade step intro"><img class="house" src="'+HOUSE+'" alt=""><div class="stack"><h1>'+l.title+'</h1><p>'+l.sub+'</p><button class="btn primary" data-act="vibes">'+l.start+'</button><button class="link" data-act="direct">'+l.noquiz+'</button></div></div>';
 else if(S.step==="vibes")h+='<div class="stack fade step wide"><h2>'+l.vibesTitle+'</h2><p class="small">'+l.vibesSub+'</p><div class="vibes">'+KEYS.map(function(k){return '<article><h3>'+esc(V[k].name)+'</h3><p>'+V[k][S.lang].tag+'</p>'+roles(k)+'</article>'}).join("")+'</div><button class="btn primary" data-act="quiz">'+l.toQuiz+'</button><button class="link" data-act="direct">'+l.noquiz+'</button></div>';
 else if(S.step==="quiz"){var q=Q[S.i];h+='<div class="stack fade step"><div class="bar"><i style="width:'+(S.i/Q.length*100)+'%"></i></div><p class="label">'+l.q+' '+(S.i+1)+' '+l.of+' '+Q.length+'</p><h2>'+esc(q[S.lang])+'</h2>'
  +q.o.map(function(o){return '<button class="btn" data-ans="'+o[0]+'">'+esc(S.lang==="de"?o[1]:o[2])+'</button>'}).join("")
  +(S.i>=1?'<button class="link" data-act="result">'+l.skip+'</button>':'')+'</div>'}
 else if(S.step==="result"){var k=score(S.ans);h+='<div class="stack fade step"><p class="label">'+l.you+'</p><div class="vibe">'+esc(V[k].name)+'</div><p>'+V[k][S.lang].tag+'</p><p class="label" style="margin-top:8px">'+l.at+'</p>'+roles(k)+'<p class="small">'+l.offer+'</p><h2 style="margin-top:12px">'+l.join+'</h2>'+form()+'</div>'}
 else if(S.step==="direct")h+='<div class="stack fade step"><h2>'+l.directTitle+'</h2><p class="small">'+l.offer+'</p>'+form()+'<button class="link" data-act="intro">'+l.back+'</button></div>';
 else if(S.step==="sent")h+='<div class="stack fade step"><h2>'+l.sent+'</h2><p>'+l.sentSub+'</p><a class="btn primary" href="https://www.instagram.com/speicher_100/" target="_blank" rel="noopener">'+l.insta+'</a><button class="link" data-act="reset">'+l.again+'</button></div>';
 return h+foot()}

function readForm(){var g=function(id){return document.getElementById(id)};if(!g("f"))return;

 else if(ENDPOINT){fetch(ENDPOINT,{method:"POST",credentials:"omit",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)}).then(function(r){return r.json()}).then(done,function(){done({ok:false,error:"net"})})}
 else done({ok:false,error:"net"});
});
